name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - name: Assemble site
        run: |
          mkdir -p pages
          cp -r index.html assets CNAME .nojekyll pages/

      # The privacy policy has one source, docs/privacy.html in the app repo,
      # so the copy served here cannot drift from the one at fdroid.keycardpal.com.
      - name: Pull privacy policy from the app repo
        run: |
          curl -fsSL -o pages/privacy.html \
            https://raw.githubusercontent.com/mmlado/keycard-pal/main/docs/privacy.html
          grep -q "Keycard Pal Privacy Policy" pages/privacy.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages/

      - id: deploy
        uses: actions/deploy-pages@v4
